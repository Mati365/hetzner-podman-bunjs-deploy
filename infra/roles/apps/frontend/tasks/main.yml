- name: Ensure app-frontend volume dir is present
  file:
    path: '{{ item }}'
    state: directory
    owner: app_front
    group: app_front
    mode: '0750'
  loop:
    - '{{ podman.volumes_dir }}/app-frontend'

- name: app-frontend envs are synced
  register: app_frontend_env_file
  template:
    src: '{{ local_paths.envs_dir }}/frontend.env'
    dest: '{{ podman.volumes_dir }}/app-frontend/frontend.env'
    owner: app_front
    group: app_front
    mode: 0644

- name: Ensure app-frontend.container exists
  become_user: app_front
  register: app_frontend_container_file
  blockinfile:
    path: ~/.config/containers/systemd/app-frontend.container
    create: true
    block: |
      [Unit]
      Description=The app-frontend container
      After=local-fs.target
      StartLimitIntervalSec=5

      [Container]
      Image=0.0.0.0:5000/app-frontend:latest
      LogDriver=journald
      Label=io.containers.autoupdate=registry
      PublishPort=3004:3000

      Environment=APP_ENV=production
      Environment=SERVER_PORT=3000
      EnvironmentFile={{ podman.volumes_dir }}/app-frontend/frontend.env

      [Service]
      TimeoutStartSec=15
      Restart=always
      RestartSec=8

      [Install]
      WantedBy=default.target

- name: Ensure app-frontend service works
  become_user: app_front
  ignore_errors: yes
  systemd:
    scope: user
    name: app-frontend
    state: '{{ "restarted" if app_frontend_container_file.changed or app_frontend_env_file.changed else "started" }}'
    enabled: true
    daemon_reload: true
